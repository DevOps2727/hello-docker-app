name: Build and Health-Check Docker Image

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hello-docker-app:ci .

      - name: Run container in the background
        run: docker run -d --name hello-docker-app-ci -p 3000:3000 hello-docker-app:ci

      - name: Wait for container to become healthy
        run: |
          echo "Waiting for the app to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "App is healthy!"
              exit 0
            fi
            echo "Not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "App did not become healthy in time."
          docker logs hello-docker-app-ci
          exit 1

      - name: Show container logs (always, for debugging)
        if: always()
        run: docker logs hello-docker-app-ci

      - name: Stop and remove container
        if: always()
        run: docker rm -f hello-docker-app-ci
